<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - IEEE EventHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            IEEE EventHub
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card">

                <div class="card-body">

                    <h2 class="mb-4">
                        Admin Login
                    </h2>


                    {% with messages = get_flashed_messages() %}

                        {% if messages %}

                            {% for message in messages %}

                                <div class="alert alert-danger">
                                    {{ message }}
                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Login
                        </button>

                    </form>


                    <a
                        href="/"
                        class="btn btn-link mt-3"
                    >
                        ← Back to Event List
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/loading.js') }}"></script>


</body>

</html>
