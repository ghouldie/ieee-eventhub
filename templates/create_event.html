<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Event - IEEE EventHub</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>


<body>


    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="/"
            >
                IEEE EventHub
            </a>

            <a
                href="/admin/logout"
                class="btn btn-outline-light"
            >
                Logout
            </a>

        </div>

    </nav>


    <!-- MAIN CONTENT -->
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-7">


                <!-- HEADER -->
                <h1>
                    Create Event
                </h1>

                <p class="text-secondary">
                    Add a new event to IEEE EventHub.
                </p>

                <hr>


                <!-- FLASH MESSAGE -->
                {% with messages = get_flashed_messages() %}

                    {% if messages %}

                        {% for message in messages %}

                            <div
                                class="alert alert-danger"
                                role="alert"
                            >
                                {{ message }}
                            </div>

                        {% endfor %}

                    {% endif %}

                {% endwith %}


                <!-- CREATE EVENT FORM -->
                <form method="POST">


                    <!-- EVENT TITLE -->
                    <div class="mb-3">

                        <label
                            for="title"
                            class="form-label"
                        >
                            Event Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            class="form-control"
                            placeholder="Example: IEEE AI Workshop"
                            required
                        >

                    </div>


                    <!-- DESCRIPTION -->
                    <div class="mb-3">

                        <label
                            for="description"
                            class="form-label"
                        >
                            Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            class="form-control"
                            rows="5"
                            placeholder="Describe the event..."
                            required
                        ></textarea>

                    </div>


                    <!-- DATE -->
                    <div class="mb-3">

                        <label
                            for="date"
                            class="form-label"
                        >
                            Event Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            name="date"
                            class="form-control"
                            required
                        >

                    </div>


                    <!-- LOCATION -->
                    <div class="mb-3">

                        <label
                            for="location"
                            class="form-label"
                        >
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            name="location"
                            class="form-control"
                            placeholder="Example: ITB Jatinangor"
                            required
                        >

                    </div>


                    <!-- STATUS -->
                    <div class="mb-4">

                        <label
                            for="status"
                            class="form-label"
                        >
                            Status
                        </label>

                        <select
                            id="status"
                            name="status"
                            class="form-select"
                            required
                        >

                            <option
                                value=""
                                selected
                                disabled
                            >
                                Select event status
                            </option>

                            <option value="Upcoming">
                                Upcoming
                            </option>

                            <option value="Ongoing">
                                Ongoing
                            </option>

                            <option value="Completed">
                                Completed
                            </option>

                        </select>

                    </div>


                    <!-- BUTTONS -->
                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Create Event
                        </button>


                        <a
                            href="/admin/dashboard"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>


                </form>

            </div>

        </div>

    </div>


    <!-- LOADING SCRIPT -->
    <script src="{{ url_for('static', filename='js/loading.js') }}"></script>


</body>

</html>
