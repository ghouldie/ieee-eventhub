<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ event["title"] }} - IEEE EventHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="/">
                IEEE EventHub
            </a>

        </div>
    </nav>


    <div class="container mt-5">

        <a href="/" class="btn btn-outline-secondary mb-4">
            ← Back to Events
        </a>

        <div class="card">

            <div class="card-body">

                <h1 class="card-title">
                    {{ event["title"] }}
                </h1>

                <span class="badge bg-success mb-3">
                    {{ event["status"] }}
                </span>

                <p class="card-text">
                    {{ event["description"] }}
                </p>

                <hr>

                <p>
                    <strong>Date:</strong>
                    {{ event["date"] }}
                </p>

                <p>
                    <strong>Location:</strong>
                    {{ event["location"] }}
                </p>

            </div>

        </div>

    </div>

</body>

</html>
