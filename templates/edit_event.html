<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Event - IEEE EventHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            IEEE EventHub
        </a>

        <a
            href="/admin/logout"
            class="btn btn-outline-light"
        >
            Logout
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <h1>Edit Event</h1>

            <p class="text-secondary">
                Update event information.
            </p>

            <hr>


            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-danger">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form method="POST">


                <div class="mb-3">

                    <label class="form-label">
                        Event Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        value="{{ event['title'] }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="5"
                        required
                    >{{ event["description"] }}</textarea>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Date
                    </label>

                    <input
                        type="date"
                        name="date"
                        class="form-control"
                        value="{{ event['date'] }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input
                        type="text"
                        name="location"
                        class="form-control"
                        value="{{ event['location'] }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select
                        name="status"
                        class="form-select"
                        required
                    >

                        <option
                            value="Upcoming"
                            {% if event["status"] == "Upcoming" %}
                                selected
                            {% endif %}
                        >
                            Upcoming
                        </option>

                        <option
                            value="Ongoing"
                            {% if event["status"] == "Ongoing" %}
                                selected
                            {% endif %}
                        >
                            Ongoing
                        </option>

                        <option
                            value="Completed"
                            {% if event["status"] == "Completed" %}
                                selected
                            {% endif %}
                        >
                            Completed
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn btn-warning"
                >
                    Save Changes
                </button>


                <a
                    href="/admin/dashboard"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>


            </form>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/loading.js') }}"></script>

</body>

</html>
